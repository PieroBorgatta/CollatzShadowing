name: Lean Action CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      build_docs:
        description: Build and deploy API documentation after formal checks
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5
      - name: Verify synchronized source bytes
        run: python3 tools/export_from_collatz.py --check
      - uses: leanprover/lean-action@v1
        with:
          build: 'true'
          axiom-audit: 'true'
          # Exact historical finite checks; no new native axiom is allowed.
          axiom-audit-allow: >-
            propext,Classical.choice,Quot.sound,
            CollatzShadowing.smallOddHasDirectDropWithin100Bool._native.native_decide.ax_1_1,
            CollatzShadowing.smallOddHasDirectDropWithin100Bool464._native.native_decide.ax_1_1,
            CollatzShadowing.smallOddHasDirectDropWithin100Bool648._native.native_decide.ax_1_1,
            CollatzShadowing.Generated.a0SemanticSuffixPairCertificatesT14Prototype_allValid._native.native_decide.ax_1_1,
            CollatzShadowing.Generated.a0SemanticSuffixPairCertificatesT14_rowCount._native.native_decide.ax_1_1,
            CollatzShadowing.Generated.a0SemanticSuffixPairCertificatesT14_allValid._native.native_decide.ax_1_1,
            CollatzShadowing.Generated.a0SemanticSuffixPairCertificatesT14_allValidAtCutoff455._native.native_decide.ax_1_1,
            CollatzShadowing.Generated.a0SemanticSuffixPairCertificatesT14_matches_summary._native.native_decide.ax_1_1,
            CollatzShadowing.Generated.a0SemanticSuffixT14PairCoverageV2Lt8Cap100_summary._native.native_decide.ax_1_1
      - name: Strict November theorem dependency audits
        run: |
          lake env lean verification/November13DependencyAudit.lean
          lake env lean verification/November15DependencyAudit.lean
          lake env lean verification/FiniteCatalogueDependencyAudit.lean
      - uses: leanprover-community/docgen-action@v1
        if: github.event_name == 'workflow_dispatch' && inputs.build_docs && github.ref == 'refs/heads/main'
